name: Deploy iPhone camera app to GitHub Pages

on:
  push:
    branches: [claude/iphone-camera-app-qw1sqr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ios-camera-app
      - id: deployment
        uses: actions/deploy-pages@v4
