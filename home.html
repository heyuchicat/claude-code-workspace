<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title></title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  form {
    width: 100%;
    max-width: 420px;
    padding: 0 28px;
    text-align: center;
  }
  .mark {
    font-size: 15px;
    color: #9a9a9e;
    margin-bottom: 24px;
    letter-spacing: 0.04em;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 16px;
    border-radius: 22px;
    background: #f0f0f2;
    border: 1px solid #e1e1e4;
  }
  .search-box svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #8a8a8e;
    stroke-width: 2;
    flex-shrink: 0;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    outline: none;
    font-size: 15px;
    color: #1c1c1e;
  }
  input[type="text"]::placeholder {
    color: #9a9a9e;
  }
</style>
</head>
<body>
  <form id="f">
    <div class="mark">検索</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="検索、またはWebサイトを入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
    </div>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var q = document.getElementById("q").value.trim();
      if (!q) return;
      if (window.parent !== window) {
        window.parent.postMessage({ type: "camera-app-navigate", query: q }, "*");
      }
    });
  </script>
</body>
</html>
